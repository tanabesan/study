<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>歴史暗記マスター ＆ ヨーロッパ首都地図</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  .perspective-1000{perspective:1000px}
  .transform-style-3d{transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1)}
  .backface-hidden{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .rotate-y-180{transform:rotateY(180deg)}
  .card-h{height:clamp(250px,46dvh,400px)}
  .card-h.europe{height:clamp(340px,60dvh,520px)}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #cat-chips::-webkit-scrollbar{display:none}
  summary{list-style:none}summary::-webkit-details-marker{display:none}
  @keyframes pulse-ring{0%{transform:scale(.9);opacity:.9}50%{transform:scale(1.5);opacity:.45}100%{transform:scale(.9);opacity:.9}}
  .pin-pulse{animation:pulse-ring 1.6s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
  .ctry{fill:#1b2638;stroke:#3b4a63;stroke-width:.6;stroke-linejoin:round}
  .ctry.quiz{fill:#263650}
  .ctry.target{fill:#e11d48;stroke:#fecdd3;stroke-width:1}
  .map-svg{width:100%;height:auto;display:block}
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

<main class="max-w-4xl mx-auto px-4 pt-3 pb-40 sm:py-6 sm:pb-40 flex-1 w-full flex flex-col gap-3 sm:gap-5">

  <!-- 設定 -->
  <section class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-3 shadow-xl">
    <div id="cat-chips" class="flex flex-nowrap gap-2 overflow-x-auto pb-2" style="scrollbar-width:none;-webkit-overflow-scrolling:touch"></div>
    <select id="category-select" class="hidden">
      <option value="all">すべて</option><option value="napoleon">ナポレオン</option><option value="bakumatsu">幕末・開国</option>
      <option value="civilwar">南北戦争</option><option value="meiji">明治維新</option><option value="germany">ドイツ統一</option><option value="europe">ヨーロッパ首都</option>
    </select>
    <div class="mt-1 flex bg-slate-900 p-1 rounded-xl border border-slate-700" role="tablist">
      <button id="mode-flashcard" class="flex-1 py-2.5 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-clone"></i>暗記カード</button>
      <button id="mode-quiz" class="flex-1 py-2.5 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-list-check"></i>4択</button>
      <button id="mode-type" class="flex-1 py-2.5 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-keyboard"></i>記述</button>
    </div>
    <div id="count-row" class="hidden mt-2 flex items-center gap-2">
      <label for="quiz-mode-select" class="text-xs font-semibold text-slate-400 shrink-0"><i class="fa-solid fa-list-ol text-indigo-400 mr-1"></i>出題数</label>
      <select id="quiz-mode-select" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        <option value="10-rand" selected>ランダム 10問</option>
        <option value="20-rand">ランダム 20問</option>
        <option value="all-rand">全問をランダムに</option>
        <option value="all-seq">全問を順番に</option>
      </select>
    </div>
    <div class="mt-2.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-slate-300">
      <span>対象 <strong id="total-count" class="font-mono text-slate-100">0</strong>問</span>
      <span><i class="fa-solid fa-circle-check text-emerald-400 mr-0.5"></i>覚えた <strong id="stat-known" class="font-mono text-emerald-300">0</strong>/<span id="stat-total" class="font-mono">0</span></span>
      <span><i class="fa-solid fa-rotate-left text-rose-400 mr-0.5"></i>要復習 <strong id="stat-wrong" class="font-mono text-rose-300">0</strong></span>
      <span>正答率 <strong id="stat-acc" class="font-mono text-indigo-300">-</strong></span>
    </div>
    <div class="mt-1.5 h-1.5 bg-slate-900 rounded-full overflow-hidden border border-slate-700/60"><div id="stat-bar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-500" style="width:0%"></div></div>
    <details class="mt-2.5 group/d">
      <summary class="text-xs text-slate-400 cursor-pointer select-none py-1"><i class="fa-solid fa-sliders mr-1.5 text-indigo-400"></i>出題範囲（復習など）</summary>
      <div class="grid grid-cols-1 gap-3 mt-2">
        <div>
          <label for="range-select" class="block text-[11px] font-semibold text-slate-400 mb-1">出題範囲</label>
          <select id="range-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            <option value="all">すべての問題</option><option value="wrong">間違えた問題だけ（復習）</option><option value="unlearned">まだ覚えていない問題</option>
          </select>
        </div>
      </div>
      <div class="text-right mt-2"><button id="reset-btn" class="text-[11px] text-slate-500 hover:text-rose-400 transition"><i class="fa-solid fa-trash-can mr-1"></i>記録をリセット</button></div>
    </details>
  </section>

  <!-- 該当なし -->
  <section id="empty-view" class="hidden bg-slate-800/80 rounded-2xl border border-slate-700/70 p-10 text-center">
    <i class="fa-solid fa-champagne-glasses text-4xl text-amber-300 mb-3"></i>
    <p id="empty-text" class="font-bold text-slate-100 mb-1">該当する問題がありません</p>
    <p class="text-xs text-slate-400">カテゴリや出題範囲を変更してください。</p>
  </section>

  <!-- 暗記カード -->
  <section id="flashcard-view" class="flex flex-col gap-4">
    <div class="perspective-1000 w-full cursor-pointer group card-h" id="flashcard">
      <div id="card-inner" class="transform-style-3d relative w-full h-full rounded-2xl shadow-2xl border border-slate-700 bg-slate-800">
        <div class="backface-hidden absolute inset-0 p-5 sm:p-7 flex flex-col gap-3 bg-slate-800 rounded-2xl border border-slate-700/80">
          <div class="flex justify-between items-center text-xs gap-2">
            <span id="card-num" class="font-mono text-indigo-400 font-bold bg-indigo-950/80 px-3 py-1 rounded-lg border border-indigo-800/50">Q.1 / 1</span>
            <span class="flex items-center gap-2">
              <span id="card-status" class="hidden px-2.5 py-1 rounded-full text-[11px] font-bold"></span>
              <span id="card-cat" class="bg-slate-700/60 text-slate-300 px-3 py-1 rounded-full border border-slate-600 font-medium">カテゴリ</span>
            </span>
          </div>
          <div id="card-map-wrap" class="hidden relative rounded-lg overflow-hidden border border-slate-700 flex-1 min-h-0">
            <svg id="card-map" class="map-svg w-full h-full" preserveAspectRatio="xMidYMid meet"></svg>
            <button id="card-zoom" class="absolute top-2 right-2 text-[11px] px-2.5 py-1 rounded-lg bg-slate-900/90 border border-slate-600 text-slate-200 hover:border-indigo-400"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i><span>拡大</span></button>
          </div>
          <div id="card-q-wrap" class="my-auto flex items-center justify-center">
            <p id="card-question" class="text-lg sm:text-2xl font-bold text-slate-100 leading-relaxed text-center">問題</p>
          </div>
          <div class="text-center text-xs text-indigo-400 flex items-center justify-center gap-2 font-medium opacity-80 group-hover:opacity-100 transition"><i class="fa-solid fa-rotate"></i><span>タップ／Space で答えを確認</span></div>
        </div>
        <div class="backface-hidden rotate-y-180 absolute inset-0 p-5 sm:p-7 flex flex-col justify-between bg-slate-800 rounded-2xl border-2 border-indigo-500/80">
          <div class="flex justify-between items-center text-xs">
            <span class="text-indigo-400 font-bold"><i class="fa-solid fa-key mr-1"></i>解答</span>
            <span class="bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full font-semibold border border-indigo-500/30">ANSWER</span>
          </div>
          <div class="my-auto text-center py-3 overflow-y-auto">
            <h2 id="card-answer" class="text-2xl sm:text-4xl font-extrabold text-amber-300 leading-tight mb-2">答え</h2>
            <p id="card-sub" class="text-sm text-slate-300 font-semibold mb-2"></p>
            <p id="card-note" class="text-xs sm:text-sm text-slate-300/90 leading-relaxed bg-slate-900/60 border border-slate-700 rounded-xl px-3 py-2 max-w-md mx-auto hidden"></p>
          </div>
          <div class="text-center text-xs text-slate-400">タップで問題に戻る</div>
        </div>
      </div>
    </div>

  </section>

  <!-- クイズ（4択・記述 共通） -->
  <section id="quiz-view" class="hidden bg-slate-800/90 rounded-2xl shadow-2xl p-5 sm:p-6 border border-slate-700/80 flex flex-col gap-5">
    <div id="quiz-map-wrap" class="hidden w-full bg-slate-900 border border-slate-700 rounded-xl p-3">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs text-indigo-300 font-semibold"><i class="fa-solid fa-map-location-dot mr-1.5"></i>赤い国の首都を答えよう</span>
        <button id="quiz-zoom" class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-600 text-slate-200 hover:border-indigo-400"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i><span>拡大</span></button>
      </div>
      <div class="max-w-xl mx-auto rounded-lg overflow-hidden border border-slate-800"><svg id="quiz-map" class="map-svg" preserveAspectRatio="xMidYMid meet"></svg></div>
    </div>

    <div>
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700/80">
        <span id="quiz-progress" class="text-xs font-mono font-bold text-indigo-400 bg-indigo-950/80 px-3 py-1 rounded-lg border border-indigo-800/50">問題 1 / 10</span>
        <span id="quiz-score" class="text-xs font-bold text-emerald-400 bg-emerald-950/80 px-3 py-1 rounded-lg border border-emerald-800/50">スコア: 0</span>
      </div>
      <span id="quiz-cat" class="inline-block bg-slate-700/80 text-slate-300 text-xs px-2.5 py-1 rounded-full mb-3 font-medium border border-slate-600">カテゴリ</span>
      <h3 id="quiz-question" class="text-base sm:text-xl font-bold text-slate-100 leading-relaxed mb-5">問題文</h3>
      <div id="quiz-options" class="grid grid-cols-1 gap-3"></div>
    </div>

    <div>
      <div id="quiz-feedback" class="hidden p-4 rounded-xl mb-3 text-sm"></div>
      
    </div>
  </section>
</main>

<div id="bottom-bar" class="fixed bottom-0 inset-x-0 z-40 bg-slate-950/95 backdrop-blur border-t border-slate-800" style="padding-bottom:max(.5rem,env(safe-area-inset-bottom))">
  <div class="max-w-4xl mx-auto px-4 pt-2">
    <div id="bar-flash" class="flex flex-col gap-2">    <div class="grid grid-cols-2 gap-3">
      <button id="unknown-btn" class="py-3 rounded-xl font-bold bg-rose-950/70 border border-rose-700/70 text-rose-200 hover:bg-rose-900/70 active:scale-[.98] transition"><i class="fa-solid fa-rotate-left mr-1.5"></i>まだ <kbd class="ml-1 text-[10px] opacity-60 font-mono">J</kbd></button>
      <button id="known-btn" class="py-3 rounded-xl font-bold bg-emerald-950/70 border border-emerald-700/70 text-emerald-200 hover:bg-emerald-900/70 active:scale-[.98] transition"><i class="fa-solid fa-check mr-1.5"></i>覚えた <kbd class="ml-1 text-[10px] opacity-60 font-mono">K</kbd></button>
    </div>
    <div class="flex items-center gap-3">
      <button id="prev-btn" class="flex-1 py-3 bg-slate-800 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-slate-700 active:scale-[.98] transition disabled:opacity-40 disabled:pointer-events-none"><i class="fa-solid fa-arrow-left mr-1.5"></i>前へ</button>
      <button id="shuffle-btn" class="px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-slate-300 hover:text-white hover:bg-slate-700 active:scale-[.98] transition" title="シャッフル"><i class="fa-solid fa-shuffle text-lg"></i></button>
      <button id="next-btn" class="flex-1 py-3 bg-indigo-600 rounded-xl font-bold text-white hover:bg-indigo-500 active:scale-[.98] transition shadow-lg shadow-indigo-600/30 disabled:opacity-40 disabled:pointer-events-none">次へ<i class="fa-solid fa-arrow-right ml-1.5"></i></button>
    </div>
</div>
    <div id="bar-quiz" class="hidden"><button id="quiz-next-btn" disabled class="w-full py-3.5 disabled:opacity-35 disabled:pointer-events-none bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-500 active:scale-[.98] transition shadow-lg shadow-indigo-600/30"><span id="quiz-next-label">次の問題へ</span><i class="fa-solid fa-arrow-right ml-2"></i></button></div>
  </div>
</div>

<footer class="hidden sm:block mb-28 bg-slate-950 border-t border-slate-800 py-4 px-4 text-center text-xs text-slate-500 leading-relaxed">
  <p class="mb-1">キー操作：<kbd class="font-mono">←</kbd><kbd class="font-mono">→</kbd> 前後　<kbd class="font-mono">Space</kbd> めくる／次へ　<kbd class="font-mono">K</kbd> 覚えた　<kbd class="font-mono">J</kbd> まだ　<kbd class="font-mono">1〜4</kbd> 選択肢</p>
  <p>© 歴史暗記マスター</p>
</footer>

<script>
const Q = [{"id":1,"cat":"napoleon","catName":"ナポレオン","q":"1795年憲法によって成立した、5人の総裁による集団指導体制の政府を何というか。","a":"総裁政府","n":"1795年憲法（共和国第3年憲法）で成立。5人の総裁が権力を分担し、1799年まで続いた。"},{"id":2,"cat":"napoleon","catName":"ナポレオン","q":"フランス革命期に軍人として頭角を現し、のちにフランス皇帝となった人物は誰か。","a":"ナポレオン＝ボナパルト","n":"コルシカ島出身の軍人。1804年に皇帝に即位（第一帝政）し、1815年に失脚。"},{"id":3,"cat":"napoleon","catName":"ナポレオン","q":"1796～1797年、ナポレオンがオーストリア軍と戦い勝利した軍事行動を何というか。","a":"イタリア遠征","n":"1796〜97年。オーストリア軍を破り、1797年のカンポ＝フォルミオ条約につながった。"},{"id":5,"cat":"napoleon","catName":"ナポレオン","q":"1798年、イギリスとインドの結びつきを弱めるためにナポレオンが行った軍事行動を何というか。","a":"エジプト遠征","n":"1798年。イギリスとインドの連絡を断つ狙いだったが、ナイルの海戦でイギリス艦隊に敗れた。"},{"id":7,"cat":"napoleon","catName":"ナポレオン","q":"1799年、ナポレオンが総裁政府を打倒した事件を何というか。","a":"ブリュメール18日のクーデタ","n":"1799年。ブリュメールは革命暦の「霧月」。ナポレオンが第一統領となり総裁政府が倒れた。"},{"id":8,"cat":"napoleon","catName":"ナポレオン","q":"1804年、ナポレオンが皇帝に即位した際の称号は何か。","a":"皇帝ナポレオン一世","n":"1804年に国民投票を経て皇帝に即位（第一帝政）。"},{"id":9,"cat":"napoleon","catName":"ナポレオン","q":"ナポレオンが1800年に設立し、フランスの産業発展の基礎となった金融機関は何か。","a":"フランス銀行"},{"id":10,"cat":"napoleon","catName":"ナポレオン","q":"1804年、フランス革命の成果を法律によって保障するために制定された民法典を何というか。","a":"ナポレオン法典","n":"1804年制定。私有財産の保障・法の前の平等・契約の自由などを定めた。"},{"id":11,"cat":"napoleon","catName":"ナポレオン","q":"1805年、フランス海軍がイギリス海軍に敗れ、イギリス上陸を断念することになった戦いを何というか。","a":"トラファルガーの海戦","n":"1805年。イギリスのネルソン提督は戦死したが勝利し、ナポレオンはイギリス上陸を断念。"},{"id":13,"cat":"napoleon","catName":"ナポレオン","q":"1806年、イギリス経済に打撃を与えるため、ナポレオンがヨーロッパ諸国とイギリスの通商を禁止した命令を何というか。","a":"大陸封鎖令","n":"1806年のベルリン勅令。イギリスの産業革命後の工業製品の市場を閉ざす狙い。"},{"id":14,"cat":"napoleon","catName":"ナポレオン","q":"1812年、ナポレオンが大軍を率いてロシアへ侵攻した軍事行動を何というか。","a":"ロシア遠征","n":"1812年。モスクワに入ったが冬の寒さと補給不足で撤退し、大損害を受けた。"},{"id":15,"cat":"napoleon","catName":"ナポレオン","q":"ナポレオンが1812年にロシアへ侵攻したのはなぜか。","a":"ロシアが大陸封鎖令に違反したから"},{"id":16,"cat":"napoleon","catName":"ナポレオン","q":"ロシア遠征に失敗したナポレオンに対し、反ナポレオン連合が行った戦争を何というか。","a":"解放戦争"},{"id":17,"cat":"napoleon","catName":"ナポレオン","q":"1813年、ナポレオンが反ナポレオン連合軍に敗れた、諸国民戦争とも呼ばれる戦いを何というか。","a":"ライプツィヒの戦い","n":"1813年。諸国民戦争とも呼ばれ、ナポレオンが大敗した。"},{"id":18,"cat":"napoleon","catName":"ナポレオン","q":"1814年、皇帝を退位したナポレオンが最初に流刑となった島はどこか。","a":"エルバ島","n":"1814年、連合軍にパリを占領され退位。"},{"id":19,"cat":"napoleon","catName":"ナポレオン","q":"1815年、皇帝に復帰したナポレオンがイギリスなどの連合軍に敗れた戦いを何というか。","a":"ワーテルローの戦い","n":"1815年。エルバ島を脱出して復位した「百日天下」の末、ウェリントン率いる英軍などに敗北。"},{"id":20,"cat":"napoleon","catName":"ナポレオン","q":"ワーテルローの戦いに敗れたナポレオンが、最後に流刑となった島はどこか。","a":"セントヘレナ島","n":"1815年に流され、1821年に同地で没した。"},{"id":21,"cat":"bakumatsu","catName":"幕末・開国","q":"1853年、アメリカ大統領フィルモアの国書を携え、黒船を率いて日本に来航した人物は誰か。","a":"ペリー","n":"1853年、浦賀沖に来航して開国を要求。翌1854年に再来航した。"},{"id":22,"cat":"bakumatsu","catName":"幕末・開国","q":"1853年、アメリカの黒船が来航した、現在の神奈川県横須賀市にある港はどこか。","a":"浦賀"},{"id":23,"cat":"bakumatsu","catName":"幕末・開国","q":"ペリー来航時に老中首座を務め、アメリカ大統領の国書を受理した人物は誰か。","a":"阿部正弘","n":"福山藩主。老中首座として開国に対応し、安政の改革を進めた。"},{"id":24,"cat":"bakumatsu","catName":"幕末・開国","q":"ペリー来航後、幕府が国書の内容を報告し、開国問題について意見を求めた、天皇を中心とする京都の政治機関を何というか。","a":"朝廷"},{"id":25,"cat":"bakumatsu","catName":"幕末・開国","q":"ペリー来航後、幕府が江戸湾の防衛のために築いた砲台施設を何というか。","a":"台場"},{"id":26,"cat":"bakumatsu","catName":"幕末・開国","q":"1854年、日本とアメリカが締結し、日本の鎖国体制を終わらせることになった条約は何か。","a":"日米和親条約","n":"1854年。下田・箱館の開港、燃料・食料の供給、領事の駐在などを認めた。"},{"id":27,"cat":"bakumatsu","catName":"幕末・開国","q":"日米和親条約によって開港された2つの港はどこか。","a":"下田と箱館"},{"id":28,"cat":"bakumatsu","catName":"幕末・開国","q":"他国に与えた最も有利な待遇を、条約相手国にも与える制度を何というか。","a":"最恵国待遇","n":"日米和親条約で日本が一方的に認めた。"},{"id":29,"cat":"bakumatsu","catName":"幕末・開国","q":"1856年、日本との通商条約締結を求め、アメリカ総領事として下田に着任した人物は誰か。","a":"ハリス"},{"id":30,"cat":"bakumatsu","catName":"幕末・開国","q":"1856年に始まり、イギリスとフランスが清を攻撃した戦争を何というか。","a":"アロー戦争"},{"id":31,"cat":"bakumatsu","catName":"幕末・開国","q":"1858年、天皇の許可を得ずに通商条約を締結した大老は誰か。","a":"井伊直弼","n":"彦根藩主。1858年に大老に就任し、勅許なしで条約に調印した。"},{"id":32,"cat":"bakumatsu","catName":"幕末・開国","q":"1858年、日本とアメリカが締結し、自由貿易を認めた条約を何というか。","a":"日米修好通商条約","n":"1858年。神奈川・長崎・新潟・兵庫を開港。領事裁判権を認め、関税自主権がない不平等条約。"},{"id":33,"cat":"bakumatsu","catName":"幕末・開国","q":"日米修好通商条約で認められた、外国人の犯罪をその国の領事が裁く権利を何というか。","a":"領事裁判権"},{"id":34,"cat":"bakumatsu","catName":"幕末・開国","q":"日米修好通商条約では、日本が輸入商品などにかける税率を自主的に決定する権利を持たなかった。この権利を何というか。","a":"関税自主権"},{"id":35,"cat":"bakumatsu","catName":"幕末・開国","q":"井伊直弼が将軍に擁立した徳川慶福は、将軍就任後、何と名乗ったか。","a":"徳川家茂"},{"id":36,"cat":"bakumatsu","catName":"幕末・開国","q":"1858～1859年、井伊直弼が政治的反対派を厳しく弾圧した事件を何というか。","a":"安政の大獄","n":"1858〜59年。吉田松陰・橋本左内らが処刑された。"},{"id":37,"cat":"bakumatsu","catName":"幕末・開国","q":"安政の大獄によって処刑された、長州藩出身の思想家は誰か。","a":"吉田松陰","n":"松下村塾で高杉晋作・伊藤博文らを育てた。"},{"id":38,"cat":"bakumatsu","catName":"幕末・開国","q":"1860年、尊王攘夷派の浪士によって井伊直弼が暗殺された事件を何というか。","a":"桜田門外の変","n":"1860年3月。水戸脱藩の浪士らが江戸城桜田門外で襲撃した。"},{"id":39,"cat":"bakumatsu","catName":"幕末・開国","q":"19世紀のアメリカ北部では、工業や商業を中心とするどのような産業を発達させたか。","a":"商工業"},{"id":40,"cat":"bakumatsu","catName":"幕末・開国","q":"19世紀のアメリカ南部で、黒人奴隷の労働力を利用して綿花などを栽培した大規模な農業経営を何というか。","a":"大農園"},{"id":41,"cat":"civilwar","catName":"南北戦争","q":"イギリス製品との競争を避けるため、アメリカ北部が求めた、輸入品に高い関税をかける政策を何というか。","a":"保護関税政策"},{"id":42,"cat":"civilwar","catName":"南北戦争","q":"イギリスとの綿花貿易を重視したアメリカ南部が求めた、貿易への制限を少なくする考え方を何というか。","a":"自由貿易主義"},{"id":43,"cat":"civilwar","catName":"南北戦争","q":"19世紀のアメリカ北部では、黒人奴隷制度に対してどのような立場をとる人々が多かったか。","a":"反対"},{"id":44,"cat":"civilwar","catName":"南北戦争","q":"19世紀のアメリカ南部では、黒人奴隷制度に対してどのような立場をとる人々が多かったか。","a":"賛成"},{"id":45,"cat":"civilwar","catName":"南北戦争","q":"1860年の大統領選挙でリンカンを擁立した、奴隷制の拡大に反対する政党は何か。","a":"共和党","n":"1860年の選挙でリンカンが当選し、南部諸州の連邦離脱につながった。"},{"id":46,"cat":"civilwar","catName":"南北戦争","q":"南北戦争前、奴隷制を支持する南部の人々が主に支持した政党は何か。","a":"民主党"},{"id":48,"cat":"civilwar","catName":"南北戦争","q":"1820年、アメリカの新しい州における奴隷制の扱いを決めた取り決めを何というか。","a":"ミズーリ協定","n":"1820年。北緯36度30分以北には新しい奴隷州を認めない取り決め。"},{"id":49,"cat":"civilwar","catName":"南北戦争","q":"ミズーリ協定で、自由州と奴隷州を区分する基準となった緯度は何度何分か。","a":"北緯36度30分"},{"id":50,"cat":"civilwar","catName":"南北戦争","q":"アメリカで奴隷制度を禁止した州を何というか。","a":"自由州"},{"id":51,"cat":"civilwar","catName":"南北戦争","q":"アメリカで奴隷制度を合法的に認めていた州を何というか。","a":"奴隷州"},{"id":52,"cat":"civilwar","catName":"南北戦争","q":"1852年、ストウ夫人が黒人奴隷の悲惨な生活を描き、奴隷制への批判を高めた小説は何か。","a":"「アンクル・トムの小屋」","n":"1852年刊行。奴隷制反対の世論を高めた。"},{"id":54,"cat":"civilwar","catName":"南北戦争","q":"1854年、カンザスとネブラスカで奴隷制を認めるかどうかを住民投票で決めるとした法律を何というか。","a":"カンザス・ネブラスカ法","n":"1854年。ミズーリ協定を事実上無効にし、共和党結成のきっかけとなった。"},{"id":55,"cat":"civilwar","catName":"南北戦争","q":"1861年、アメリカ大統領に就任し、南北戦争中に奴隷解放を宣言した人物は誰か。","a":"リンカン","n":"第16代大統領。1861年に就任し、1865年に暗殺された。"},{"id":56,"cat":"civilwar","catName":"南北戦争","q":"1861年、アメリカ合衆国から脱退した南部諸州が結成した国家を何というか。","a":"アメリカ連合国","n":"1861年に成立。首都はリッチモンド、大統領はデヴィス。"},{"id":58,"cat":"civilwar","catName":"南北戦争","q":"1862年、一定期間定住した西部開拓者に公有地を無償で与えると定めた法律を何というか。","a":"ホームステッド法","n":"1862年。西部の土地を開放し、西部開拓者の支持を集めた。"},{"id":59,"cat":"civilwar","catName":"南北戦争","q":"リンカンがホームステッド法を制定した際、支持を獲得しようとした人々は誰か。","a":"西部開拓者"},{"id":60,"cat":"civilwar","catName":"南北戦争","q":"1863年、リンカンが南部の奴隷の解放を宣言したものを何というか。","a":"奴隷解放宣言","n":"1863年1月1日発効。実際には反乱諸州の奴隷が対象。"},{"id":61,"cat":"civilwar","catName":"南北戦争","q":"リンカンの奴隷解放宣言は、どの地域の奴隷の解放を宣言したものか。","a":"南部"},{"id":62,"cat":"civilwar","catName":"南北戦争","q":"リンカンが奴隷解放宣言を出した政治的なねらいを答えなさい。","a":"戦争の目的を明確化し、内外の支持を得るため"},{"id":63,"cat":"civilwar","catName":"南北戦争","q":"1863年、北軍が勝利し、南北戦争の主導権を握るきっかけとなった戦いを何というか。","a":"ゲティスバーグの戦い","n":"1863年7月。同年11月、戦没者追悼式でリンカンが演説した。"},{"id":64,"cat":"civilwar","catName":"南北戦争","q":"南北戦争で北軍を指揮し、最終的な勝利に貢献した将軍は誰か。","a":"グラント将軍","n":"北軍総司令官。のち第18代大統領。"},{"id":65,"cat":"civilwar","catName":"南北戦争","q":"ゲティスバーグでリンカンが行った演説の、民主政治を象徴する有名な言葉を答えなさい。","a":"人民の、人民による、人民のための政治"},{"id":66,"cat":"civilwar","catName":"南北戦争","q":"1865年に陥落し、南北戦争終結につながったアメリカ連合国の首都はどこか。","a":"リッチモンド","n":"1865年4月に陥落し、南軍は降伏。"},{"id":67,"cat":"civilwar","catName":"南北戦争","q":"1865年、アメリカで奴隷制を全面的に廃止した憲法の条項は何か。","a":"憲法修正第13条","n":"1865年に成立。奴隷制の全面廃止を定めた。"},{"id":68,"cat":"meiji","catName":"幕末と明治維新","q":"1860年頃、朝廷と幕府が協力して幕府の権威を回復しようとした考え方を何というか。","a":"公武合体論","n":"孝明天皇の妹・和宮が将軍徳川家茂に降嫁（1862年）。"},{"id":70,"cat":"meiji","catName":"幕末と明治維新","q":"1866年、薩摩藩と長州藩が対立を解消し、協力関係を築いた同盟を何というか。","a":"薩長同盟","n":"1866年。坂本龍馬・中岡慎太郎らが仲介した。"},{"id":71,"cat":"meiji","catName":"幕末と明治維新","q":"薩長同盟の成立に関わり、薩摩藩を代表する人物の一人として幕末の政治に大きな影響を与えた人物は誰か。","a":"西郷隆盛"},{"id":72,"cat":"meiji","catName":"幕末と明治維新","q":"薩摩藩出身で、岩倉具視とともに討幕に向けた準備を進め、のちに明治新政府の中心人物となったのは誰か。","a":"大久保利通","n":"薩摩藩出身。のち内務卿として明治政府を主導。"},{"id":73,"cat":"meiji","catName":"幕末と明治維新","q":"薩長同盟の成立に関わった長州藩の代表的な人物は誰か。","a":"木戸孝允"},{"id":74,"cat":"meiji","catName":"幕末と明治維新","q":"薩長同盟の成立を仲介した土佐藩出身の人物は誰か。","a":"坂本龍馬"},{"id":75,"cat":"meiji","catName":"幕末と明治維新","q":"1866年に第15代将軍に就任し、翌1867年に大政奉還を行った人物は誰か。","a":"徳川慶喜","n":"1866年末に将軍就任。1867年10月に大政奉還を行った。"},{"id":76,"cat":"meiji","catName":"幕末と明治維新","q":"1867年、徳川慶喜が政権を朝廷に返上した出来事を何というか。","a":"大政奉還","n":"1867年10月（旧暦）。"},{"id":77,"cat":"meiji","catName":"幕末と明治維新","q":"幕末、薩摩藩の大久保利通と協力し、討幕に向けて活動した公家は誰か。","a":"岩倉具視"},{"id":78,"cat":"meiji","catName":"幕末と明治維新","q":"討幕派が討幕の密勅を得ようとした、孝明天皇の次に即位した天皇は誰か。","a":"明治天皇"},{"id":79,"cat":"meiji","catName":"幕末と明治維新","q":"1867年12月9日、幕府の廃止と新政府の設置を宣言した政治的な命令を何というか。","a":"王政復古の大号令","n":"1867年12月9日。幕府を廃止し、天皇中心の新政府を樹立すると宣言。"},{"id":81,"cat":"meiji","catName":"幕末と明治維新","q":"1868〜1869年、新政府軍と旧幕府軍の間で行われた一連の内戦を何というか。","a":"戊辰戦争"},{"id":82,"cat":"meiji","catName":"幕末と明治維新","q":"1868年1月、旧幕府軍と新政府軍が京都周辺で戦い、戊辰戦争の始まりとなった戦いを何というか。","a":"鳥羽・伏見の戦い","n":"1868年1月。戊辰戦争の始まり。"},{"id":83,"cat":"meiji","catName":"幕末と明治維新","q":"江戸城の無血開城に向けて新政府側と交渉した、旧幕府側の代表的人物は誰か。","a":"勝海舟","n":"西郷隆盛との会談により、1868年に江戸城が無血開城された。"},{"id":84,"cat":"meiji","catName":"幕末と明治維新","q":"戊辰戦争の最終段階で、榎本武揚や土方歳三ら旧幕府側の勢力が函館で新政府軍と戦った戦いを何というか。","a":"五稜郭の戦い","n":"1869年。榎本武揚らは蝦夷地に政権（蝦夷共和国）をつくったが降伏した。"},{"id":85,"cat":"germany","catName":"ドイツ統一","q":"19世紀、ドイツ統一の中心となり、急速な工業化によって発展した新興国家はどこか。","a":"プロイセン"},{"id":86,"cat":"germany","catName":"ドイツ統一","q":"19世紀、プロイセンとドイツ統一の主導権を争った伝統的なドイツ人国家はどこか。","a":"オーストリア"},{"id":87,"cat":"germany","catName":"ドイツ統一","q":"神聖ローマ帝国の皇帝を長く輩出し、オーストリアを支配した王家を何というか。","a":"ハプスブルク家"},{"id":88,"cat":"germany","catName":"ドイツ統一","q":"1848年、ドイツ諸邦の代表が集まり、統一と憲法制定について協議した会議を何というか。","a":"フランクフルト国民議会","n":"1848年、フランクフルトで開催。翌年プロイセン王が帝冠を拒否し、統一は失敗した。"},{"id":89,"cat":"germany","catName":"ドイツ統一","q":"ドイツ統一に際し、オーストリアのドイツ人地域を含めて統一しようとする考え方を何というか。","a":"大ドイツ主義","n":"オーストリア皇帝を盟主とする案。"},{"id":90,"cat":"germany","catName":"ドイツ統一","q":"ドイツ統一に際し、オーストリアを除外して統一しようとする考え方を何というか。","a":"小ドイツ主義","n":"プロイセン王を中心とする案。最終的にこちらで統一された。"},{"id":91,"cat":"germany","catName":"ドイツ統一","q":"フランクフルト国民議会による統一の試みは、どのような性格の統一を目指していたか。","a":"自由主義"},{"id":92,"cat":"germany","catName":"ドイツ統一","q":"1861年、プロイセン国王となり、のちに初代ドイツ皇帝となった人物は誰か。","a":"ヴィルヘルム1世","n":"1871年、ヴェルサイユ宮殿でドイツ皇帝に即位。"},{"id":93,"cat":"germany","catName":"ドイツ統一","q":"1862年、プロイセン首相に就任し、武力を重視してドイツ統一を実現した政治家は誰か。","a":"ビスマルク","n":"1862年にプロイセン首相に就任。鉄血政策で統一を進めた。"},{"id":94,"cat":"germany","catName":"ドイツ統一","q":"ビスマルクは鉄血演説で、ドイツ統一問題は言論や多数決ではなく、何によって解決されると主張したか。","a":"鉄と血","n":"1862年の演説。「鉄（武器）と血（兵士）」による解決を主張した。"},{"id":95,"cat":"germany","catName":"ドイツ統一","q":"ビスマルクが軍事力を重視して進めた、ドイツ統一のための政策を何というか。","a":"鉄血政策"},{"id":96,"cat":"germany","catName":"ドイツ統一","q":"ビスマルクの鉄血政策は、具体的にどのような軍事政策を重視したものか。","a":"軍備拡張政策"},{"id":97,"cat":"germany","catName":"ドイツ統一","q":"1864年、プロイセンとオーストリアが領土問題をめぐってデンマークと戦った戦争を何というか。","a":"デンマーク戦争","n":"1864年。シュレスヴィヒ・ホルシュタイン問題が原因。"},{"id":98,"cat":"germany","catName":"ドイツ統一","q":"1866年、ドイツ統一の主導権をめぐってプロイセンとオーストリアが戦った戦争を何というか。","a":"プロイセン=オーストリア戦争","n":"1866年。普墺戦争。プロイセンが勝利し、ドイツ連邦は解体された。"},{"id":99,"cat":"germany","catName":"ドイツ統一","q":"1866年のプロイセンの勝利を受け、翌年、プロイセンを中心にドイツ北部の諸邦が結成した国家連合を何というか。","a":"北ドイツ連邦","n":"1867年成立。盟主はプロイセン。"},{"id":101,"cat":"germany","catName":"ドイツ統一","q":"1870～1871年、プロイセンがフランスを破り、ドイツ統一を完成させるきっかけとなった戦争を何というか。","a":"プロイセン=フランス戦争","n":"1870〜71年。普仏戦争。ナポレオン3世がスダンで降伏した。"},{"id":102,"cat":"germany","catName":"ドイツ統一","q":"1871年、プロイセンを中心として成立した統一ドイツ国家を何というか。","a":"ドイツ帝国","n":"1871年1月、ヴェルサイユ宮殿で成立宣言。"},{"id":103,"cat":"germany","catName":"ドイツ統一","q":"プロイセン=フランス戦争に敗れたフランスが、ドイツ側に割譲した地域はどこか。","a":"アルザス・ロレーヌ地方","n":"1871年のフランクフルト条約で割譲された。"},{"id":104,"cat":"germany","catName":"ドイツ統一","q":"ビスマルクによるドイツ統一は、どのような形で達成されたか。","a":"オーストリアを除外し、プロイセンを中心とした統一を達成"},{"id":201,"cat":"europe","catName":"ヨーロッパ首都","q":"地図で赤く示された国の首都 const stOf = id => (progress[id] && progress[id].s) || null;
function record(id, ok){
  const p = progress[id] || (progress[id] = {ok:0, ng:0, s:null});
  if (ok) p.ok++; else p.ng++;
  p.s = ok ? 'ok' : 'ng';
  saveProgress(); updateStats();
}

/* ---------- 状態 ---------- */
let currentQuestions = [];
let currentIndex = 0;
let isFlipped = false;
let currentMode = 'flashcard'; // flashcard | quiz | type
let quizQuestions = [], quizIndex = 0, quizScore = 0, quizMissed = [], quizAnswered = false, quizFinished = false;
let zoomOn = false;

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const categorySelect = $('category-select'), rangeSelect = $('range-select'), quizModeSelect = $('quiz-mode-select');
const modeBtns = { flashcard:$('mode-flashcard'), quiz:$('mode-quiz'), type:$('mode-type') };
const flashcardView = $('flashcard-view'), quizView = $('quiz-view'), emptyView = $('empty-view');
const flashcard = $('flashcard'), cardInner = $('card-inner');
const quizOptions = $('quiz-options'), quizFeedback = $('quiz-feedback'), quizNextBtn = $('quiz-next-btn');

/* ---------- ユーティリティ ---------- */
function shuffle(a){ a = [...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const norm = s => String(s).normalize('NFKC').replace(/[\s・･=＝「」『』、。,.\-ー]/g,'').toLowerCase();
function kindOf(q){
  if (q._k) return q._k;
  let k;
  if (q.cat==='europe') k='capital';
  else if (/誰/.test(q.q)) k='person';
  else if (/どこ/.test(q.q)) k='place';
  else if (/(戦い|戦争|海戦|事件|変|獄|クーデタ|遠征|奉還|号令|宣言)$/.test(q.a)) k='event';
  else if (/(条約|協定|法典|法|令|同盟|条)$/.test(q.a)) k='doc';
  else k='concept';
  return q._k = k;
}
const displayQ = q => q.cat==='europe' ? '地図で赤く示された国の首都はどこか。' : q.q;
function isSelfGrade(q){ return q.a.length >= SELF_GRADE_LEN; }

function makeChoices(q){
  if (DISTRACTORS[q.id]) return shuffle([q.a, ...DISTRACTORS[q.id]]);
  const k = kindOf(q), cands = new Map();
  Q.forEach(o=>{
    if (o.id===q.id || o.a===q.a || o.a.length>=SELF_GRADE_LEN) return;
    if (o.a.includes(q.a) || q.a.includes(o.a)) return;
    let s = 0;
    if (kindOf(o)===k) s += 10;
    if (o.cat===q.cat) s += 5;
    if (o.a.slice(-1)===q.a.slice(-1)) s += 2;
    s -= Math.min(Math.abs(o.a.length-q.a.length),10)*0.3;
    s += Math.random()*3;
    if (!cands.has(o.a) || cands.get(o.a) < s) cands.set(o.a, s);
  });
  const picked = [...cands.entries()].sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]);
  return shuffle([q.a, ...picked]);
}

/* ---------- 地図 ---------- */
function buildMap(svg){
  svg.setAttribute('viewBox','0 0 800 600');
  let h = '<rect width="800" height="600" fill="#0b1220"/>';
  MAP.countries.forEach(c=>{ h += `<path class="ctry${c.id?' quiz':''}" data-id="${c.id||''}" d="${c.d}"/>`; });
  h += '<g class="pins"></g>';
  svg.innerHTML = h;
}
function setMapTarget(svg, id, zoom){
  svg.querySelectorAll('.ctry.target').forEach(p=>p.classList.remove('target'));
  const path = svg.querySelector(`.ctry[data-id="${id}"]`);
  if (path) path.classList.add('target');
  const pos = MAP.pins[id], g = svg.querySelector('.pins');
  g.innerHTML = '';
  if (!pos) return;
  const r = zoom ? 3.2 : 6;
  g.innerHTML = `<circle class="pin-pulse" cx="${pos[0]}" cy="${pos[1]}" r="${r*1.6}" fill="#fb7185" fill-opacity=".45"/>` +
                `<circle cx="${pos[0]}" cy="${pos[1]}" r="${r}" fill="#fff" stroke="#be123c" stroke-width="${zoom?1:1.8}"/>`;
  if (zoom){
    const w=260, h=195;
    const x = Math.max(0, Math.min(800-w, pos[0]-w/2)), y = Math.max(0, Math.min(600-h, pos[1]-h/2));
    svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  } else svg.setAttribute('viewBox','0 0 800 600');
}
function syncZoomLabels(){
  document.querySelectorAll('#card-zoom span, #quiz-zoom span').forEach(s=>s.textContent = zoomOn ? '全体' : '拡大');
  document.querySelectorAll('#card-zoom i, #quiz-zoom i').forEach(i=>{ i.className = zoomOn ? 'fa-solid fa-magnifying-glass-minus mr-1' : 'fa-solid fa-magnifying-glass-plus mr-1'; });
}
function refreshMaps(){
  if (currentMode==='flashcard'){ const q=currentQuestions[currentIndex]; if(q&&q.cat==='europe') setMapTarget($('card-map'), q.id, zoomOn); }
  else { const q=quizQuestions[quizIndex]; if(q&&q.cat==='europe'&&!quizFinished) setMapTarget($('quiz-map'), q.id, zoomOn); }
  syncZoomLabels();
}

/* ---------- 統計 ---------- */
const CATS = [['all','すべて'],['napoleon','ナポレオン'],['bakumatsu','幕末・開国'],['civilwar','南北戦争'],['meiji','明治維新'],['germany','ドイツ統一'],['europe','ヨーロッパ首都']];
function renderChips(){
  const box = $('cat-chips'); box.innerHTML = '';
  CATS.forEach(([key,label])=>{
    const list = key==='all' ? Q : Q.filter(q=>q.cat===key);
    const known = list.filter(q=>stOf(q.id)==='ok').length;
    const on = categorySelect.value===key;
    const b = document.createElement('button');
    b.className = 'shrink-0 whitespace-nowrap px-3 py-2 rounded-xl text-xs font-semibold border transition text-left ' + (on ? 'bg-indigo-600 border-indigo-400 text-white shadow' : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-indigo-500');
    const t = document.createElement('div'); t.textContent = label;
    const sub = document.createElement('div'); sub.className = 'text-[10px] font-mono mt-0.5 ' + (on ? 'text-indigo-100' : 'text-slate-500'); sub.textContent = `${known}/${list.length} 覚えた`;
    b.append(t, sub);
    b.addEventListener('click', ()=>{ categorySelect.value = key; applyAll(); });
    box.appendChild(b);
    if (on) box.dataset.sel = String(box.children.length-1);
  });
  const cur = box.children[Number(box.dataset.sel||0)];
  if (cur) box.scrollLeft = cur.offsetLeft - box.clientWidth/2 + cur.clientWidth/2;
}
function updateStats(){
  renderChips();
  const known = Q.filter(q=>stOf(q.id)==='ok').length;
  const wrong = Q.filter(q=>stOf(q.id)==='ng').length;
  let ok=0, ng=0; Object.values(progress).forEach(p=>{ ok+=p.ok||0; ng+=p.ng||0; });
  $('stat-known').textContent = known; $('stat-total').textContent = Q.length; $('stat-wrong').textContent = wrong;
  $('stat-acc').textContent = (ok+ng) ? Math.round(ok/(ok+ng)*100)+'%' : '-';
  $('stat-bar').style.width = (known/Q.length*100)+'%';
}

/* ---------- 出題プール ---------- */
function getPool(){
  const cat = categorySelect.value, r = rangeSelect.value;
  let list = cat==='all' ? [...Q] : Q.filter(q=>q.cat===cat);
  if (r==='wrong') list = list.filter(q=>stOf(q.id)==='ng');
  else if (r==='unlearned') list = list.filter(q=>stOf(q.id)!=='ok');
  return list;
}

function setModeButtons(){
  Object.entries(modeBtns).forEach(([m,b])=>{
    const base = 'flex-1 py-2 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5 ';
    b.className = base + (m===currentMode ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200');
  });
}

function applyAll(){
  renderChips();
  currentQuestions = getPool();
  currentIndex = 0;
  $('total-count').textContent = currentQuestions.length;
  setModeButtons();
  const empty = currentQuestions.length===0;
  $('count-row').classList.toggle('hidden', currentMode==='flashcard');
  $('bar-flash').classList.toggle('hidden', empty || currentMode!=='flashcard');
  $('bar-quiz').classList.toggle('hidden', empty || currentMode==='flashcard');
  emptyView.classList.toggle('hidden', !empty);
  if (empty){
    flashcardView.classList.add('hidden'); quizView.classList.add('hidden');
    $('empty-text').textContent = rangeSelect.value==='wrong' ? '間違えた問題はありません 🎉' : rangeSelect.value==='unlearned' ? 'すべて覚えました 🎉' : '該当する問題がありません';
    return;
  }
  if (currentMode==='flashcard'){
    flashcardView.classList.remove('hidden'); quizView.classList.add('hidden'); renderCard();
  } else {
    flashcardView.classList.add('hidden'); quizView.classList.remove('hidden'); startQuiz();
  }
}

/* ---------- 暗記カード ---------- */
function renderCard(){
  if (!currentQuestions.length) return;
  isFlipped = false; cardInner.classList.remove('rotate-y-180');
  const q = currentQuestions[currentIndex], eu = q.cat==='europe';
  flashcard.classList.toggle('europe', eu);
  $('card-num').textContent = `Q.${currentIndex+1} / ${currentQuestions.length}`;
  $('card-cat').textContent = q.catName;
  $('card-question').textContent = displayQ(q);
  $('card-answer').textContent = q.a;
  $('card-sub').textContent = eu ? `${q.country}の首都` : '';
  const note = $('card-note'); note.textContent = q.n || ''; note.classList.toggle('hidden', !q.n);
  $('card-map-wrap').classList.toggle('hidden', !eu);
  $('card-q-wrap').classList.toggle('my-auto', !eu);
  if (eu) setMapTarget($('card-map'), q.id, zoomOn);
  const s = stOf(q.id), badge = $('card-status');
  badge.classList.toggle('hidden', !s);
  if (s){ badge.textContent = s==='ok' ? '覚えた' : '要復習'; badge.className = 'px-2.5 py-1 rounded-full text-[11px] font-bold border ' + (s==='ok' ? 'bg-emerald-950 text-emerald-300 border-emerald-700' : 'bg-rose-950 text-rose-300 border-rose-700'); }
  $('prev-btn').disabled = currentIndex===0;
  $('next-btn').disabled = currentIndex===currentQuestions.length-1;
  syncZoomLabels();
}
function flipCard(){ isFlipped = !isFlipped; cardInner.classList.toggle('rotate-y-180', isFlipped); }
function markCard(ok){
  const q = currentQuestions[currentIndex]; if(!q) return;
  record(q.id, ok);
  if (currentIndex < currentQuestions.length-1){ currentIndex++; renderCard(); } else renderCard();
}
function moveCard(d){ const n = currentIndex+d; if(n>=0 && n<currentQuestions.length){ currentIndex=n; renderCard(); } }

/* ---------- クイズ ---------- */
function startQuiz(custom){
  let list = custom ? shuffle(custom) : getPool();
  if (!custom){
    const s = quizModeSelect.value;
    if (s!=='all-seq') list = shuffle(list);
    if (s==='10-rand') list = list.slice(0,10);
    if (s==='20-rand') list = list.slice(0,20);
  }
  quizQuestions = list; quizIndex = 0; quizScore = 0; quizMissed = []; quizAnswered = false; quizFinished = false;
  if (!list.length){ applyAll(); return; }
  renderQuizQuestion();
}

function renderQuizQuestion(){
  quizAnswered = false;
  quizFeedback.classList.add('hidden'); quizNextBtn.disabled = true; $('bar-quiz').classList.remove('hidden');
  const q = quizQuestions[quizIndex], eu = q.cat==='europe';
  $('quiz-progress').textContent = `問題 ${quizIndex+1} / ${quizQuestions.length}`;
  $('quiz-score').textContent = `スコア: ${quizScore}`;
  $('quiz-cat').textContent = q.catName;
  $('quiz-question').textContent = displayQ(q);
  $('quiz-map-wrap').classList.toggle('hidden', !eu);
  if (eu) setMapTarget($('quiz-map'), q.id, zoomOn);
  syncZoomLabels();
  quizOptions.innerHTML = '';

  if (isSelfGrade(q)) renderSelfGrade(q);
  else if (currentMode==='type') renderTypeInput(q);
  else renderChoices(q);
}

function renderChoices(q){
  const opts = makeChoices(q);
  opts.forEach((opt,idx)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn w-full text-left p-4 rounded-xl bg-slate-900/90 border border-slate-700/80 hover:border-indigo-500 hover:bg-slate-700/50 transition font-medium text-slate-200 flex items-center gap-3 active:scale-[.99]';
    const num = document.createElement('span');
    num.className = 'w-6 h-6 shrink-0 rounded-full bg-slate-800 text-slate-400 font-mono text-xs flex items-center justify-center border border-slate-700 font-bold';
    num.textContent = idx+1;
    const label = document.createElement('span'); label.textContent = opt;
    btn.append(num, label);
    btn.dataset.value = opt;
    btn.addEventListener('click', ()=>answerChoice(q, opt, btn));
    quizOptions.appendChild(btn);
  });
}

function answerChoice(q, selected, btn){
  if (quizAnswered) return;
  const ok = selected === q.a;
  quizOptions.querySelectorAll('button').forEach(b=>{
    b.disabled = true;
    if (b.dataset.value === q.a) b.className = 'choice-btn w-full text-left p-4 rounded-xl bg-emerald-950/80 border-2 border-emerald-500 font-bold text-emerald-200 flex items-center gap-3';
    else if (b===btn) b.className = 'choice-btn w-full text-left p-4 rounded-xl bg-rose-950/80 border-2 border-rose-500 font-bold text-rose-200 flex items-center gap-3';
    else b.className = 'choice-btn w-full text-left p-4 rounded-xl bg-slate-900/50 border border-slate-800 text-slate-500 flex items-center gap-3';
  });
  finishQuestion(q, ok);
}

function renderTypeInput(q){
  const wrap = document.createElement('div'); wrap.className = 'flex flex-col gap-3';
  const input = document.createElement('input');
  input.id = 'type-input'; input.type = 'text'; input.autocomplete = 'off'; input.autocapitalize = 'off'; input.spellcheck = false;
  input.placeholder = '答えを入力（Enterで解答）';
  input.className = 'w-full bg-slate-900 border border-slate-600 rounded-xl p-3.5 text-base text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500';
  const row = document.createElement('div'); row.className = 'grid grid-cols-3 gap-2';
  const submit = document.createElement('button');
  submit.className = 'col-span-2 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-white transition';
  submit.textContent = '解答する';
  const skip = document.createElement('button');
  skip.className = 'py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 hover:bg-slate-700 text-sm transition';
  skip.textContent = 'わからない';
  const go = (giveUp)=>{
    if (quizAnswered) return;
    const v = input.value.trim();
    if (!v && !giveUp) return;
    const accepted = [q.a, ...(ALTS[q.id]||[])].map(norm);
    const ok = !giveUp && accepted.includes(norm(v));
    input.disabled = submit.disabled = skip.disabled = true;
    input.className += ok ? ' border-emerald-500' : ' border-rose-500';
    finishQuestion(q, ok);
  };
  submit.addEventListener('click', ()=>go(false));
  skip.addEventListener('click', ()=>go(true));
  input.addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.isComposing){ e.preventDefault(); go(false); } });
  row.append(submit, skip);
  wrap.append(input, row);
  quizOptions.appendChild(wrap);
  setTimeout(()=>input.focus(), 50);
}

function renderSelfGrade(q){
  const wrap = document.createElement('div'); wrap.className = 'flex flex-col gap-3';
  const hint = document.createElement('p'); hint.className = 'text-xs text-slate-400'; hint.textContent = '文章で答える問題です。頭の中で答えてから、答えを確認して自己採点しましょう。';
  const show = document.createElement('button');
  show.className = 'py-3.5 rounded-xl bg-slate-900 border border-indigo-500/60 text-indigo-300 font-bold hover:bg-slate-700 transition';
  show.innerHTML = '<i class="fa-solid fa-eye mr-2"></i>答えを見る';
  const ans = document.createElement('div'); ans.className = 'hidden p-4 rounded-xl bg-slate-900 border border-amber-500/40 text-amber-300 font-bold leading-relaxed'; ans.textContent = q.a;
  const row = document.createElement('div'); row.className = 'hidden grid grid-cols-2 gap-3';
  const ng = document.createElement('button'); ng.className = 'py-3 rounded-xl bg-rose-950/70 border border-rose-700/70 text-rose-200 font-bold hover:bg-rose-900/70'; ng.textContent = 'できなかった';
  const ok = document.createElement('button'); ok.className = 'py-3 rounded-xl bg-emerald-950/70 border border-emerald-700/70 text-emerald-200 font-bold hover:bg-emerald-900/70'; ok.textContent = 'できた';
  show.addEventListener('click', ()=>{ show.classList.add('hidden'); ans.classList.remove('hidden'); row.classList.remove('hidden'); });
  const grade = v => { if (quizAnswered) return; row.classList.add('hidden'); finishQuestion(q, v, true); };
  ok.addEventListener('click', ()=>grade(true)); ng.addEventListener('click', ()=>grade(false));
  row.append(ng, ok);
  wrap.append(hint, show, ans, row);
  quizOptions.appendChild(wrap);
}

function finishQuestion(q, ok, selfGraded){
  quizAnswered = true;
  record(q.id, ok);
  if (ok) quizScore++; else quizMissed.push(q);
  $('quiz-score').textContent = `スコア: ${quizScore}`;
  const box = quizFeedback;
  box.className = 'p-4 rounded-xl mb-3 text-sm border ' + (ok ? 'bg-emerald-950/80 border-emerald-500/50 text-emerald-200' : 'bg-rose-950/80 border-rose-500/50 text-rose-200');
  box.innerHTML = '';
  const head = document.createElement('p'); head.className = 'font-bold text-center';
  if (ok) head.innerHTML = '<i class="fa-solid fa-circle-check mr-1.5"></i>正解です！';
  else {
    head.innerHTML = '<i class="fa-solid fa-circle-xmark mr-1.5"></i>不正解… ';
    if (!selfGraded){
      head.append('正解は「');
      const s = document.createElement('strong'); s.className = 'text-amber-300'; s.textContent = q.a; head.append(s, '」');
    }
  }
  box.appendChild(head);
  if (q.cat==='europe'){ const p = document.createElement('p'); p.className = 'mt-1 text-center text-slate-300'; p.textContent = `${q.country}の首都は${q.a}`; box.appendChild(p); }
  if (q.n){ const p = document.createElement('p'); p.className = 'mt-2 text-xs leading-relaxed text-slate-300 bg-slate-900/60 rounded-lg px-3 py-2'; p.textContent = '📝 ' + q.n; box.appendChild(p); }
  box.classList.remove('hidden');
  $('quiz-next-label').textContent = quizIndex+1 < quizQuestions.length ? '次の問題へ' : '結果を見る';
  quizNextBtn.disabled = false;
}

function advanceQuiz(){
  if (!quizAnswered) return;
  quizIndex++;
  if (quizIndex < quizQuestions.length) renderQuizQuestion(); else showQuizResult();
}

function showQuizResult(){
  quizFinished = true;
  $('quiz-map-wrap').classList.add('hidden');
  quizFeedback.classList.add('hidden'); $('bar-quiz').classList.add('hidden');
  $('quiz-question').textContent = 'クイズ完了！お疲れ様でした。';
  $('quiz-cat').textContent = '結果';
  const total = quizQuestions.length, acc = Math.round(quizScore/total*100);
  quizOptions.innerHTML = '';
  const card = document.createElement('div'); card.className = 'text-center py-7 bg-slate-900/80 rounded-2xl border border-slate-700/80';
  card.innerHTML = `<p class="text-xs text-slate-400 mb-1 font-semibold">最終スコア</p>
    <p class="text-4xl font-extrabold text-indigo-400 mb-3 font-mono">${quizScore} <span class="text-lg text-slate-400">/ ${total}</span></p>
    <div class="w-full bg-slate-800 rounded-full h-3 max-w-xs mx-auto mb-3 border border-slate-700 overflow-hidden"><div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full" style="width:${acc}%"></div></div>
    <p class="text-sm font-bold text-slate-200">正解率 ${acc}%</p>`;
  quizOptions.appendChild(card);
  if (quizMissed.length){
    const list = document.createElement('div'); list.className = 'p-4 rounded-xl bg-slate-900/70 border border-slate-700 text-sm';
    const t = document.createElement('p'); t.className = 'text-xs text-slate-400 font-semibold mb-2'; t.textContent = `間違えた問題（${quizMissed.length}問）`;
    list.appendChild(t);
    quizMissed.forEach(m=>{
      const row = document.createElement('div'); row.className = 'py-1.5 border-t border-slate-800 first:border-0';
      const a = document.createElement('span'); a.className = 'text-amber-300 font-bold'; a.textContent = m.cat==='europe' ? `${m.country} → ${m.a}` : m.a;
      row.appendChild(a);
      if (m.cat!=='europe'){ const qq = document.createElement('p'); qq.className = 'text-xs text-slate-400 mt-0.5'; qq.textContent = m.q; row.appendChild(qq); }
      list.appendChild(row);
    });
    quizOptions.appendChild(list);
  }
  const btns = document.createElement('div'); btns.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3';
  const again = document.createElement('button'); again.className = 'py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-white transition'; again.innerHTML = '<i class="fa-solid fa-rotate-right mr-2"></i>もう一度挑戦する';
  again.addEventListener('click', ()=>startQuiz());
  btns.appendChild(again);
  if (quizMissed.length){
    const rev = document.createElement('button'); rev.className = 'py-3.5 rounded-xl bg-rose-900/60 border border-rose-600/60 hover:bg-rose-800/60 font-bold text-rose-100 transition'; rev.innerHTML = '<i class="fa-solid fa-rotate-left mr-2"></i>間違えた問題だけ復習';
    const missed = [...quizMissed];
    rev.addEventListener('click', ()=>startQuiz(missed));
    btns.appendChild(rev);
  }
  quizOptions.appendChild(btns);
}

/* ---------- イベント ---------- */
function setMode(m){ currentMode = m; applyAll(); }
modeBtns.flashcard.addEventListener('click', ()=>setMode('flashcard'));
modeBtns.quiz.addEventListener('click', ()=>setMode('quiz'));
modeBtns.type.addEventListener('click', ()=>setMode('type'));
[categorySelect, rangeSelect].forEach(s=>s.addEventListener('change', ()=>{ s.blur(); applyAll(); }));
quizModeSelect.addEventListener('change', ()=>{ quizModeSelect.blur(); if (currentMode!=='flashcard') applyAll(); });

flashcard.addEventListener('click', flipCard);
$('prev-btn').addEventListener('click', e=>{ e.stopPropagation(); e.currentTarget.blur(); moveCard(-1); });
$('next-btn').addEventListener('click', e=>{ e.stopPropagation(); e.currentTarget.blur(); moveCard(1); });
$('shuffle-btn').addEventListener('click', e=>{ e.currentTarget.blur(); currentQuestions = shuffle(currentQuestions); currentIndex = 0; renderCard(); });
$('known-btn').addEventListener('click', e=>{ e.currentTarget.blur(); markCard(true); });
$('unknown-btn').addEventListener('click', e=>{ e.currentTarget.blur(); markCard(false); });
quizNextBtn.addEventListener('click', e=>{ e.currentTarget.blur(); advanceQuiz(); });
['card-zoom','quiz-zoom'].forEach(id=>$(id).addEventListener('click', e=>{ e.stopPropagation(); e.currentTarget.blur(); zoomOn = !zoomOn; refreshMaps(); }));
$('reset-btn').addEventListener('click', ()=>{
  if (confirm('学習記録（覚えた／間違えた・正答率）をすべてリセットしますか？')){ progress = {}; saveProgress(); updateStats(); applyAll(); }
});

document.addEventListener('keydown', e=>{
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target.tagName;
  if (tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') return;
  if (currentQuestions.length===0) return;
  const k = e.key;
  if (currentMode==='flashcard'){
    if (k==='ArrowLeft'){ moveCard(-1); }
    else if (k==='ArrowRight'){ moveCard(1); }
    else if ((k===' ' || k==='Enter') && tag!=='BUTTON'){ e.preventDefault(); flipCard(); }
    else if (k==='k' || k==='K'){ markCard(true); }
    else if (k==='j' || k==='J'){ markCard(false); }
  } else {
    if (/^[1-4]$/.test(k) && !quizAnswered && !quizFinished){
      const b = quizOptions.querySelectorAll('.choice-btn')[Number(k)-1]; if (b) b.click();
    } else if ((k==='Enter' || k===' ' || k==='ArrowRight') && quizAnswered && tag!=='BUTTON'){
      e.preventDefault(); advanceQuiz();
    }
  }
});

/* ---------- 初期化 ---------- */
buildMap($('card-map')); buildMap($('quiz-map'));
updateStats();
applyAll();
</script>
</body>
</html>
